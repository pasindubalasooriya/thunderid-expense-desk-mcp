[project]
name = "thunderid-expense-desk-mcp"
version = "0.1.0"
description = "An expense-approval MCP server secured with ThunderID: token scopes, AuthZEN runtime decisions, and application rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pyjwt>=2.9",
]

[tool.uv]
package = false
